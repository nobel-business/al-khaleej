name: Build check

# Deployments are done by Vercel's Git integration (push to main → production, PRs → preview).
# This workflow only verifies that the site builds and that every image the pages reference is committed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build site
        run: npm run build

      - name: Check every image in the manifest is committed
        run: |
          node -e '
          const fs = require("fs"), m = JSON.parse(fs.readFileSync("src/assets/images/manifest.json", "utf8"));
          const missing = Object.entries(m).flatMap(([n, e]) => e.widths.flatMap((w) => ["avif", "webp", "jpg"].map((x) => `dist/img/${n}-${w}.${x}`))).filter((f) => !fs.existsSync(f));
          if (missing.length) { console.error("Missing generated images (run npm run images and commit public/img):\n" + missing.join("\n")); process.exit(1); }
          console.log("all", Object.keys(m).length, "images present");'

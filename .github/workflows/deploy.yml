name: Build & deploy (Vercel)

# push to main  → production deployment
# pull request  → preview deployment (skipped for forks, which have no secrets)
# Deploy steps are skipped until the VERCEL_* secrets exist; the build still runs as a check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install image pipeline dependencies
        run: pip install -r scripts/requirements.txt

      # dist/img is generated (not committed). Reuse it while image sources are unchanged;
      # exact key only, because images.py skips any variant whose file already exists.
      - name: Restore generated images
        uses: actions/cache@v4
        with:
          path: dist/img
          key: img-${{ hashFiles('scripts/images.py', 'scripts/requirements.txt', 'src/assets/images/ai/**', 'src/assets/images/commons/**') }}

      - name: Generate responsive images
        run: python -I scripts/images.py

      - name: Check committed image manifest is up to date
        run: git diff --exit-code -- src/assets/images/manifest.json

      - name: Build site
        run: npm run build

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=$VERCEL_ENV --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        if: env.VERCEL_TOKEN != ''
        run: vercel build $([ "$VERCEL_ENV" = production ] && echo --prod) --token="$VERCEL_TOKEN"

      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          url=$(vercel deploy --prebuilt $([ "$VERCEL_ENV" = production ] && echo --prod) --token="$VERCEL_TOKEN")
          echo "Deployed ($VERCEL_ENV): $url"
          echo "### Deployed to Vercel ($VERCEL_ENV)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment skipped
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not set — build checked, deploy skipped."
